# personal-finance: build the arm64 extension and attach it to a GitHub release.
# The personal-finance infra-service downloads the zip by tag, checks its
# sha256 and publishes it as a Lambda layer in each of its accounts.
# Tags use a pf- prefix so they never match the upstream vX.Y.Z release flow.
name: pf-layer-artifact

on:
  push:
    tags: ["pf-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
          rustflags: ""
      - name: install cargo lambda
        run: pip3 install cargo-lambda
      - name: test
        run: cargo test --release
      - name: build
        run: cargo lambda build --extension --release --arm64
      - name: package
        run: |
          (cd target/lambda && zip -r "$GITHUB_WORKSPACE/rotel-extension-arm64.zip" extensions)
          sha256sum rotel-extension-arm64.zip | tee rotel-extension-arm64.zip.sha256
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            rotel-extension-arm64.zip rotel-extension-arm64.zip.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "arm64 Lambda extension built from ${GITHUB_SHA}." \
            --latest=false
